<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Василёк — Кабинет продавца</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/pages/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container mt-4">
        <h2>Личный кабинет продавца</h2>

        <div class="card mb-4">
            <div class="card-header">Добавить цветы</div>
            <div class="card-body">
                <form id="add-flower-form" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Наименование</label>
                        <input type="text" class="form-control" id="flower-name" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Количество</label>
                        <input type="number" class="form-control" id="flower-qty" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Дата поступления</label>
                        <input type="date" class="form-control" id="flower-arrival" required>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Добавить</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Мои цветы</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Наименование</th>
                                <th>Количество</th>
                                <th>Дата поступления</th>
                                <th>Дата продажи</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="flowers-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/pages/js/layout.js"></script>
    <script src="/pages/js/seller.js"></script>
<!-- Сделал Шипулин Алексей-->
</body>
</html>
