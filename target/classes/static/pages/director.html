<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Василёк — Кабинет директора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/pages/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container mt-4">
        <h2>Личный кабинет директора</h2>

        <div class="card mb-4">
            <div class="card-header">Добавить продавца</div>
            <div class="card-body">
                <form id="add-user-form" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">ФИО</label>
                        <input type="text" class="form-control" id="new-full-name" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-control" id="new-login" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Пароль</label>
                        <input type="text" class="form-control" id="new-password" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Добавить</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Список сотрудников</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ФИО</th>
                                <th>Логин</th>
                                <th>Роль</th>
                                <th>Статус</th>
                                <th>Дата регистрации</th>
                                <th>Дата блокировки</th>
                                <th>Дата увольнения</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/pages/js/layout.js"></script>
    <script src="/pages/js/director.js"></script>
<!-- Сделал Шипулин Алексей-->
</body>
</html>
